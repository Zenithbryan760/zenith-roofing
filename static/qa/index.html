<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QA — Universal Lead Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />

  <!-- Universal form CSS -->
  <link rel="stylesheet" href="/css/universal-form.css" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f8fafc}
    main{max-width:1100px;margin:2rem auto;padding:0 1rem}
    h1{margin:.25rem 0 1rem;font-size:1.6rem}
    .note{color:#64748b;margin:.25rem 0 1.25rem}
  </style>
</head>
<body>
  <main>
    <h1>QA – Universal Lead Form (Services)</h1>
    <p class="note">This page is only for testing on zenithroofingservices.com.</p>

    <!-- Config wrapper (controls title/button/thanks/category) -->
    <section id="universal-form-context"
             data-title="Request an Estimate"
             data-button="Request Free Estimate"
             data-disclaimer="*Free estimates exclude real estate transactions."
             data-category="QA – Universal Lead (Services)"
             data-redirect="/qa/thanks.html">
      <div data-include="/components/forms/universal-form.html"></div>
    </section>
  </main>

  <!-- Include loader (resolves data-include) -->
  <script defer src="/js/loader.js"></script>
  <!-- Universal form logic -->
  <script defer src="/js/universal-form.js"></script>
</body>
</html>
